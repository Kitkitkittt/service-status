owner: Kitkitkittt
repo: service-status

sites:
  - name: 9Router Web UI
    url: https://9router.vnibb.xyz/
    expectedStatusCodes:
      - 200
      - 307
    timeout: 15000
  - name: 9Router API Health
    url: https://9router.vnibb.xyz/api/health
    expectedStatusCodes:
      - 200
    timeout: 15000
  - name: 9Router API Auth Boundary
    url: https://9router.vnibb.xyz/v1/models
    expectedStatusCodes:
      - 401
    timeout: 15000
  - name: Research Wiki Liveness
    url: https://research.vnibb.xyz/health/live
    expectedStatusCodes:
      - 200
    timeout: 15000
  - name: Research Wiki Readiness
    url: https://research.vnibb.xyz/health/ready
    expectedStatusCodes:
      - 200
    timeout: 15000
  - name: Research Wiki Application Auth Boundary
    url: https://research.vnibb.xyz/
    expectedStatusCodes:
      - 401
    timeout: 15000
  - name: Research Wiki MCP Auth Boundary
    url: https://research.vnibb.xyz/mcp/research-brain/
    expectedStatusCodes:
      - 401
    timeout: 15000

status-website:
  baseUrl: /service-status
  name: VNI Services Status
  themeUrl: https://kitkitkittt.github.io/service-status/openai-status.css?v=uptime-bars-1
  scripts:
    - src: https://kitkitkittt.github.io/service-status/uptime-bars.js?v=1
      async: true
  introTitle: "System status"
  introMessage: Live availability for 9Router and Research Wiki. Protected endpoints are operational when anonymous requests receive HTTP 401.
  navbar:
    - title: VNI Status
      href: /service-status
    - title: GitHub
      href: https://github.com/Kitkitkittt/service-status
