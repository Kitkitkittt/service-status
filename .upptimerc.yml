status-website:
  baseUrl: /service-status
  name: VNI Services Status
  themeUrl: https://kitkitkittt.github.io/service-status/openai-status.css?v=status-performance-1
  scripts:
    - src: https://kitkitkittt.github.io/service-status/uptime-bars.js?v=status-performance-3
      async: true
  introTitle: "System status"
  introMessage: Public availability across applications, AI gateways, Grafana and Langfuse. Expected HTTP 401 means an authentication boundary passed. Checks target five-minute intervals; monitoring-evidence age is shown below. Private node, worker and telemetry health require separate authenticated monitoring.
  navbar:
    - title: VNI Status
      href: /service-status
    - title: GitHub
      href: https://github.com/Kitkitkittt/service-status
    - title: Coverage
      href: https://github.com/Kitkitkittt/service-status/blob/master/COVERAGE.md
